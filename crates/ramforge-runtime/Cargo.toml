[package]
name = "ramforge-runtime"
version = "0.1.0"
edition = "2021"
description = "RAMforge runtime – memory budget, cache, and CPU inference"
license = "MIT OR Apache-2.0"

[dependencies]
forge-core = { workspace = true }
ramforge-core = { path = "../ramforge-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
half = "2.2"
rayon = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
