[workspace]
members = [
  "crates/ramforge-core",
  "crates/ramforge-runtime",
  "crates/ramforge-cli",
]
resolver = "2"

[workspace.dependencies]
forge-core = { git = "https://github.com/NeonMC23/forgeCORE.git", rev = "1eedc192b5de3fad5f960ec0e6bfdc7f1219b5d4", package = "forge-core" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
