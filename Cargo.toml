[workspace]
members = [
  "crates/ramforge-core",
  "crates/ramforge-runtime",
  "crates/ramforge-cli",
]
resolver = "2"

[workspace.dependencies]
forge-core = { git = "https://github.com/NeonMC23/forgeCORE.git", rev = "db8a750931f819f19e9ae8d798b5fee2caa1e516", package = "forge-core" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
