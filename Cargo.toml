[workspace]
members = [
  "crates/ramforge-core",
  "crates/ramforge-runtime",
  "crates/ramforge-cli",
]
resolver = "2"

[workspace.dependencies]
forge-core = { git = "https://github.com/NeonMC23/forgeCORE.git", rev = "34919329e927437c9eec026eded27720d13d4287", package = "forge-core" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
