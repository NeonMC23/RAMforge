[workspace]
members = [
  "crates/ramforge-core",
  "crates/ramforge-runtime",
  "crates/ramforge-cli",
]
resolver = "2"

[workspace.dependencies]
forge-core = { git = "https://github.com/NeonMC23/forgeCORE.git", rev = "e5ad2d2fc89a99fd84d321a449df277e46e492c1", package = "forge-core" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
